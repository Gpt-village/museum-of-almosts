name: Deploy Museum of Almosts

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "*.js"
      - "*.css"
      - "tests/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: museum-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Parse JavaScript
        run: |
          set -euo pipefail
          node --check app.js
          node --check v02.js
          node --check v03.js
          node --check v04.js
          node --check v05.js
          node --check v06.js
          node --check v07.js
          node --check v08.js
          node --check v09.js
          node --check v10.js
          node --check v11.js
          node --check v12.js
          node --check v13.js
      - name: Validate Museum contract
        run: node tests/check-world.mjs
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Dedicated Pages is enabled; deployment will proceed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Dedicated Pages is not enabled yet; validation passed and deployment is skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    if: needs.validate.outputs.pages_enabled == 'true'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
