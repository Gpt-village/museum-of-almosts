name: Museum of Almosts smoke check

on:
  push:
    paths:
      - "index.html"
      - "*.js"
      - "*.css"
      - "tests/**"
      - ".github/workflows/smoke.yml"
  pull_request:
    paths:
      - "index.html"
      - "*.js"
      - "*.css"
      - "tests/**"
      - ".github/workflows/smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Parse JavaScript
        run: |
          set -euo pipefail
          node --check app.js
          node --check v02.js
          node --check v03.js
          node --check v04.js
          node --check v05.js
          node --check v06.js
          node --check v07.js
          node --check v08.js
          node --check v09.js
          node --check v10.js
          node --check v11.js
          node --check v12.js
          node --check v13.js
          node --check v14.js
          node --check v15.js
          node --check v16.js
          node --check v17.js
          node --check v18.js
          node --check v19.js
          node --check v20.js
          node --check v21.js
          node --check v22.js
          node --check v23.js
          node --check v24.js
          node --check v25.js
          node --check v26.js
          node --check v27.js
          node --check v28.js
          node --check v29.js
          node --check v30.js
          node --check v31.js
          node --check v32.js
          node --check v33.js

      - name: Validate Museum contract
        run: node tests/check-world.mjs
